<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>个人工作台</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="工作台" />
<meta name="theme-color" content="#2B2A28" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232B2A28'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%23C17A4A'/%3E%3C/svg%3E" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232B2A28'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%23C17A4A'/%3E%3C/svg%3E" />

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'PingFang SC','Helvetica Neue',-apple-system,BlinkMacSystemFont,sans-serif;
    background: #F6F3EE;
  }
  input, textarea, button { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }

  #app { display: flex; height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }

  /* 左侧导航 */
  #nav {
    width: 72px; flex-shrink: 0; background: #2B2A28; display: flex;
    flex-direction: column; align-items: center;
    padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: 16px; gap: 4px;
    overflow-y: auto;
  }
  #nav .logo {
    width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(135deg, #C17A4A, #B8574F); margin-bottom: 20px; flex-shrink: 0;
  }
  .nav-btn {
    width: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 0; border-radius: 14px; border: none; background: transparent; cursor: pointer;
  }
  .nav-btn.active { background: rgba(255,255,255,0.08); }
  .nav-icon {
    width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; background: transparent;
  }
  .nav-icon svg { width: 18px; height: 18px; stroke: #9A9690; }
  .nav-btn.active .nav-icon svg { stroke: #F6F3EE; }
  .nav-label { font-size: 10px; color: #7A766F; letter-spacing: 1px; }
  .nav-btn.active .nav-label { color: #F6F3EE; font-weight: 600; }

  /* 右侧内容 */
  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #content-wrap { padding: max(24px, env(safe-area-inset-top)) 20px 40px; }
  .header-date { font-size: 12px; color: #A39D93; letter-spacing: 2px; margin-bottom: 4px; }
  .header-title { font-size: 26px; font-weight: 700; color: #2B2A28; letter-spacing: 1px; margin-bottom: 24px; }

  .card { background: #FFFFFF; border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(43,42,40,0.06); }
  .card-label { font-size: 12px; color: #A39D93; letter-spacing: 1px; margin-bottom: 10px; font-weight: 600; }
  .empty-state { padding: 28px 0; text-align: center; color: #B5B0A6; font-size: 13px; }

  .input-field {
    width: 100%; font-size: 16px; padding: 10px 14px; border-radius: 12px;
    border: 1px solid #EAE5DB; outline: none; box-sizing: border-box; color: #2B2A28;
  }
  .input-field:focus { border-color: #C9C4B8; }
  textarea.input-field { resize: none; }

  .btn-primary {
    width: 100%; padding: 13px 0; border-radius: 12px; border: none; color: #FFFFFF;
    font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 6px;
  }
  .btn-primary:disabled { background: #E3DFD6 !important; cursor: default; }
  .icon-btn {
    border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .row-between { display: flex; justify-content: space-between; align-items: center; }
  .log-row {
    display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; border-bottom: 1px solid #F3F0E9;
  }
  .log-row:last-child { border-bottom: none; }

  svg.icon { width: 16px; height: 16px; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>

</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <main id="main"><div id="content-wrap"></div></main>
</div>

<script>
(function () {
  "use strict";

  // ---------- 图标 (内联 SVG path，零依赖) ----------
  var ICONS = {
    scale: '<path d="M16 16h.01"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/><path d="m12 12 2-2"/><path d="M9 5H5a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h6.17"/><path d="M19 5h-4a1 1 0 0 0-1 1v6.17"/>',
    piggy: '<path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-1.5h3V20h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2-1.5-.5-2-1-2-2z"/><path d="M2 9v1"/><path d="M8 6.5V4"/>',
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    smile: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/>',
    lang: '<path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>',
    more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    down: '<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>',
    up: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
    trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'
  };
  function iconSvg(name, color) {
    return '<svg class="icon" viewBox="0 0 24 24" stroke="' + (color || 'currentColor') + '">' + ICONS[name] + '</svg>';
  }

  var SECTIONS = [
    { key: "weight", label: "减肥", icon: "scale", color: "#4A7C6E" },
    { key: "saving", label: "存钱", icon: "piggy", color: "#C17A4A" },
    { key: "sleep", label: "作息", icon: "moon", color: "#5B6EA8" },
    { key: "mood", label: "心情", icon: "smile", color: "#B8574F" },
    { key: "english", label: "英语", icon: "lang", color: "#7A8B4A" },
    { key: "other", label: "其他", icon: "more", color: "#8A7A8C" }
  ];

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmtMD(dateStr) {
    var parts = dateStr.split("-");
    return parseInt(parts[1]) + "月" + parseInt(parts[2]) + "日";
  }
  function esc(str) {
    var div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  // ---------- 本地存储 ----------
  var STORAGE_KEY = "personal-dashboard-data-v1";
  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {
      weight: { logs: [] },
      saving: { logs: [] },
      sleep: { logs: [] },
      mood: { logs: [] },
      english: { logs: [] },
      other: { todos: [] }
    };
  }
  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch (e) {}
  }

  var state = {
    active: "weight",
    data: loadData()
  };

  function update(sectionKey, updater) {
    state.data[sectionKey] = updater(state.data[sectionKey]);
    saveData();
    render();
  }

  // ---------- 渲染导航 ----------
  function renderNav() {
    var nav = document.getElementById("nav");
    var html = '<div class="logo"></div>';
    SECTIONS.forEach(function (s) {
      var isActive = state.active === s.key;
      html += '<button class="nav-btn' + (isActive ? ' active' : '') + '" data-key="' + s.key + '">' +
        '<div class="nav-icon" style="background:' + (isActive ? s.color : 'transparent') + '">' +
        iconSvg(s.icon, isActive ? '#F6F3EE' : '#9A9690') +
        '</div><span class="nav-label">' + s.label + '</span></button>';
    });
    nav.innerHTML = html;
    nav.querySelectorAll(".nav-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.active = btn.getAttribute("data-key");
        render();
      });
    });
  }

  // ---------- 各模块渲染函数 ----------
  function cardWrap(inner, extraStyle) {
    return '<div class="card"' + (extraStyle ? ' style="' + extraStyle + '"' : '') + '>' + inner + '</div>';
  }

  function renderWeight(container, cfg) {
    var s = state.data.weight;
    var logs = s.logs || [];
    var today = todayStr();
    var last = logs[logs.length - 1];
    var prev = logs[logs.length - 2];
    var delta = (last && prev) ? (last.value - prev.value).toFixed(1) : null;

    var topCard = '<div class="card-label">今天的体重 (kg)</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:12px;">' +
      '<input class="input-field" id="w-input" type="number" inputmode="decimal" placeholder="' + (last ? last.value : '例如 58.5') + '" style="flex:1;font-size:20px;">' +
      '<button class="icon-btn" id="w-add" style="width:48px;border-radius:12px;background:' + cfg.color + ';">' + iconSvg('check', '#fff') + '</button>' +
      '</div>';

    if (last) {
      topCard += '<div style="display:flex;align-items:baseline;gap:8px;">' +
        '<span style="font-size:28px;font-weight:700;color:#2B2A28;">' + last.value + '</span>' +
        '<span style="font-size:13px;color:#A39D93;">kg</span>';
      if (delta !== null) {
        var dColor = delta < 0 ? '#4A7C6E' : (delta > 0 ? '#B8574F' : '#A39D93');
        var arrow = delta < 0 ? iconSvg('down', dColor) : (delta > 0 ? iconSvg('up', dColor) : '');
        topCard += '<span style="font-size:13px;display:flex;align-items:center;gap:2px;color:' + dColor + ';margin-left:4px;">' + arrow + (delta > 0 ? '+' + delta : delta) + '</span>';
      }
      topCard += '</div>';
    }

    var histCard = '<div class="card-label">历史记录</div>';
    if (logs.length === 0) {
      histCard += '<div class="empty-state">还没有记录，从今天开始吧</div>';
    } else {
      histCard += logs.slice().reverse().slice(0, 14).map(function (l) {
        return '<div class="log-row"><span style="color:#8A8578;">' + fmtMD(l.date) + '</span><span style="color:#2B2A28;font-weight:600;">' + l.value + ' kg</span></div>';
      }).join('');
    }

    container.innerHTML = cardWrap(topCard) + cardWrap(histCard);

    document.getElementById("w-add").addEventListener("click", function () {
      var val = parseFloat(document.getElementById("w-input").value);
      if (isNaN(val) || val <= 0) return;
      update("weight", function (s) {
        var filtered = (s.logs || []).filter(function (l) { return l.date !== today; });
        return { logs: filtered.concat([{ date: today, value: val }]) };
      });
    });
  }

  function renderSaving(container, cfg) {
    var s = state.data.saving;
    var logs = s.logs || [];
    var total = logs.reduce(function (sum, l) { return sum + l.value; }, 0);

    var topCard = '<div style="color:rgba(255,255,255,0.85);font-size:12px;margin-bottom:6px;">累计结余</div>' +
      '<div style="color:#fff;font-size:32px;font-weight:700;">¥' + total.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + '</div>';

    var formCard = '<div class="card-label">记一笔（收入为正，支出为负）</div>' +
      '<div style="margin-bottom:8px;"><input class="input-field" id="s-val" type="number" inputmode="decimal" placeholder="金额，例如 -50"></div>' +
      '<input class="input-field" id="s-note" type="text" placeholder="备注（可选）" style="margin-bottom:12px;">' +
      '<button class="btn-primary" id="s-add" style="background:' + cfg.color + ';">' + iconSvg('plus', '#fff') + ' 添加记录</button>';

    var listCard = '<div class="card-label">最近记录</div>';
    if (logs.length === 0) {
      listCard += '<div class="empty-state">还没有记录</div>';
    } else {
      listCard += logs.slice().reverse().slice(0, 20).map(function (l, i) {
        var realIdx = logs.length - 1 - i;
        var color = l.value >= 0 ? '#4A7C6E' : '#B8574F';
        return '<div class="log-row" style="align-items:center;">' +
          '<div><div style="color:#2B2A28;">' + esc(l.note || '（无备注）') + '</div><div style="color:#B5B0A6;font-size:11px;">' + fmtMD(l.date) + '</div></div>' +
          '<div style="display:flex;align-items:center;gap:10px;"><span style="font-weight:600;color:' + color + ';">' + (l.value >= 0 ? '+' : '') + l.value + '</span>' +
          '<button class="icon-btn s-remove" data-idx="' + realIdx + '">' + iconSvg('trash', '#C9C4B8') + '</button></div>' +
          '</div>';
      }).join('');
    }

    container.innerHTML = cardWrap(topCard, 'background:linear-gradient(135deg,' + cfg.color + ',#A5622F)') + cardWrap(formCard) + cardWrap(listCard);

    document.getElementById("s-add").addEventListener("click", function () {
      var val = parseFloat(document.getElementById("s-val").value);
      var note = document.getElementById("s-note").value;
      if (isNaN(val) || val === 0) return;
      update("saving", function (s) {
        return { logs: (s.logs || []).concat([{ date: todayStr(), value: val, note: note }]) };
      });
    });
    container.querySelectorAll(".s-remove").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var idx = parseInt(btn.getAttribute("data-idx"));
        update("saving", function (s) {
          return { logs: s.logs.filter(function (_, i) { return i !== idx; }) };
        });
      });
    });
  }

  function calcHours(sleep, wake) {
    if (!sleep || !wake) return null;
    var sp = sleep.split(":").map(Number), wp = wake.split(":").map(Number);
    var start = sp[0] * 60 + sp[1], end = wp[0] * 60 + wp[1];
    if (end <= start) end += 24 * 60;
    return ((end - start) / 60).toFixed(1);
  }

  function renderSleep(container, cfg) {
    var s = state.data.sleep;
    var logs = s.logs || [];
    var today = todayStr();
    var todayLog = logs.find(function (l) { return l.date === today; });

    var formCard = '<div class="card-label">今天几点睡 / 几点起</div>' +
      '<div style="display:flex;gap:10px;margin-bottom:12px;">' +
      '<div style="flex:1;"><div style="font-size:11px;color:#A39D93;margin-bottom:4px;">入睡</div><input class="input-field" id="sl-sleep" type="time" style="font-size:16px;padding:9px 10px;"></div>' +
      '<div style="flex:1;"><div style="font-size:11px;color:#A39D93;margin-bottom:4px;">起床</div><input class="input-field" id="sl-wake" type="time" style="font-size:16px;padding:9px 10px;"></div>' +
      '</div>' +
      '<button class="btn-primary" id="sl-save" style="background:' + cfg.color + ';" disabled>保存今天</button>';
    if (todayLog) {
      formCard += '<div style="margin-top:12px;font-size:13px;color:#8A8578;">今日已记录：' + todayLog.sleep + ' → ' + todayLog.wake + '（约 ' + todayLog.hours + ' 小时）</div>';
    }

    var listCard = '<div class="card-label">最近记录</div>';
    if (logs.length === 0) {
      listCard += '<div class="empty-state">还没有记录</div>';
    } else {
      listCard += logs.slice().reverse().slice(0, 14).map(function (l) {
        return '<div class="log-row"><span style="color:#8A8578;">' + fmtMD(l.date) + '</span><span style="color:#2B2A28;">' + l.sleep + ' - ' + l.wake + '<span style="color:#A39D93;margin-left:6px;">' + l.hours + 'h</span></span></div>';
      }).join('');
    }

    container.innerHTML = cardWrap(formCard) + cardWrap(listCard);

    var sleepInput = document.getElementById("sl-sleep");
    var wakeInput = document.getElementById("sl-wake");
    var saveBtn = document.getElementById("sl-save");
    function checkEnable() { saveBtn.disabled = !(sleepInput.value && wakeInput.value); }
    sleepInput.addEventListener("input", checkEnable);
    wakeInput.addEventListener("input", checkEnable);
    saveBtn.addEventListener("click", function () {
      if (!sleepInput.value || !wakeInput.value) return;
      var hours = calcHours(sleepInput.value, wakeInput.value);
      update("sleep", function (s) {
        var filtered = (s.logs || []).filter(function (l) { return l.date !== today; });
        return { logs: filtered.concat([{ date: today, sleep: sleepInput.value, wake: wakeInput.value, hours: hours }]) };
      });
    });
  }

  var MOODS = [
    { emoji: "😄", label: "开心" }, { emoji: "🙂", label: "平静" }, { emoji: "😐", label: "一般" },
    { emoji: "😔", label: "低落" }, { emoji: "😣", label: "焦虑" }
  ];
  var pickedMood = null;

  function renderMood(container, cfg) {
    var s = state.data.mood;
    var logs = s.logs || [];

    var moodBtns = MOODS.map(function (m) {
      var isPicked = pickedMood === m.label;
      return '<button class="mood-btn" data-label="' + m.label + '" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:12px;border:' +
        (isPicked ? '2px solid ' + cfg.color : '1px solid #EAE5DB') + ';background:' + (isPicked ? '#FBF6EE' : '#fff') + ';cursor:pointer;">' +
        '<span style="font-size:22px;">' + m.emoji + '</span><span style="font-size:10px;color:#8A8578;">' + m.label + '</span></button>';
    }).join('');

    var formCard = '<div class="card-label">此刻的心情</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:12px;">' + moodBtns + '</div>' +
      '<textarea class="input-field" id="m-note" rows="3" placeholder="想说点什么？（可选）" style="margin-bottom:12px;"></textarea>' +

```

  '<textarea class="input-field" id="e-content" rows="3" placeholder="内容 / 生词 / 笔记（可选）" style="margin-bottom:12px;"></textarea>' +

function renderOther(container, cfg) {
var s = state.data.other;
var todos = s.todos || [];

```
var formCard = '<div class="card-label">随手记一件事</div>' +
  '<div style="display:flex;gap:8px;">' +
  '<input class="input-field" id="o-text" type="text" placeholder="待办 / 想法 / 提醒事项" style="flex:1;">' +
  '<button class="icon-btn" id="o-add" style="width:48px;border-radius:12px;background:' + cfg.color + ';">' + iconSvg('plus', '#fff') + '</button>' +
  '</div>';

var listCard = '<div class="card-label">清单</div>';
if (todos.length === 0) {
  listCard += '<div class="empty-state">暂时没有事项</div>';
} else {
  listCard += todos.map(function (t) {
    return '<div style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #F3F0E9;">' +
      '<button class="icon-btn o-toggle" data-id="' + t.id + '" style="width:20px;height:20px;border-radius:6px;border:1.5px solid ' + (t.done ? cfg.color : '#D8D3C7') + ';background:' + (t.done ? cfg.color : 'transparent') + ';flex-shrink:0;">' +
      (t.done ? iconSvg('check', '#fff') : '') + '</button>' +
      '<span style="flex:1;font-size:14px;color:' + (t.done ? '#C9C4B8' : '#2B2A28') + ';text-decoration:' + (t.done ? 'line-through' : 'none') + ';">' + esc(t.text) + '</span>' +
      '<button class="icon-btn o-remove" data-id="' + t.id + '">' + iconSvg('trash', '#C9C4B8') + '</button>' +
      '</div>';
  }).join('');
}

container.innerHTML = cardWrap(formCard) + cardWrap(listCard);

function addTodo() {
  var input = document.getElementById("o-text");
  var text = input.value.trim();
  if (!text) return;
  update("other", function (s) {
    return { todos: (s.todos || []).concat([{ id: Date.now(), text: text, done: false }]) };
  });
}
document.getElementById("o-add").addEventListener("click", addTodo);
document.getElementById("o-text").addEventListener("keydown", function (e) {
  if (e.key === "Enter") addTodo();
});
container.querySelectorAll(".o-toggle").forEach(function (btn) {
  btn.addEventListener("click", function () {
    var id = parseInt(btn.getAttribute("data-id"));
    update("other", function (s) {
      return { todos: s.todos.map(function (t) { return t.id === id ? Object.assign({}, t, { done: !t.done }) : t; }) };
    });
  });
});
container.querySelectorAll(".o-remove").forEach(function (btn) {
  btn.addEventListener("click", function () {
    var id = parseInt(btn.getAttribute("data-id"));
    update("other", function (s) {
      return { todos: s.todos.filter(function (t) { return t.id !== id; }) };
    });
  });
});
